{% load static %}
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Ferraz Car</title>
    <script>(() => {let theme; try {theme = localStorage.getItem('ferraz-theme');} catch { } document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';})();</script>
    <link rel="stylesheet" href="{% static 'oficina/style.css' %}?v=login-1">
    <link rel="stylesheet" href="{% static 'oficina/login.css' %}">
</head>

<body class="login-page">
    <main class="login-card">
        <div class="login-logo"><img src="{% static 'oficina/logo-ferraz-car.png' %}" width="520" height="145"
                alt="Ferraz Car"></div><span class="eyebrow">GESTÃO DA OFICINA</span>
        <h1>Bem-vindo à oficina.</h1>
        <p>Entre para acompanhar seus clientes, veículos e serviços.</p>
        <form method="post" class="login-form">{% csrf_token %}
            {% if form.errors %}<div class="login-error" role="alert">Usuário ou senha incorretos. Confira os dados e
                tente novamente.</div>{% endif %}
            <label for="id_username">Usuário</label><input type="text" name="username" id="id_username"
                autocomplete="username" maxlength="150" required autofocus value="{{ form.username.value|default:'' }}">
            <label for="id_password">Senha</label><input type="password" name="password" id="id_password"
                autocomplete="current-password" required>
            <input type="hidden" name="next" value="{{ next }}"><button type="submit" class="primary">Entrar no
                painel</button>
        </form>
        <p class="login-footer">Ferraz Car · atenção em cada serviço</p>
    </main>
</body>

</html>
